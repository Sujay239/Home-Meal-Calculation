        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');

            const size = Math.random() * 8 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;

            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;

            const duration = Math.random() * 15 + 10;
            particle.style.animation = `float1 ${duration}s ease-in-out infinite`;
            particle.style.animationDelay = `${Math.random() * 5}s`;

            particlesContainer.appendChild(particle);
        }

        const signatureContainer = document.getElementById('signature-container');

        signatureText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.className = 'signature-char';
            span.style.animationDelay = `${index * 0.05 + 1.5}s`;
            signatureContainer.appendChild(span);
        });

        // Dynamic sequence animation
        const amountElement = document.getElementById('final-amount');
        const step1 = document.getElementById('calc-step-1');
        const step2 = document.getElementById('calc-step-2');

        const sequence = [
            { text: "₹ 1,200", class: "opacity-50" },
            { text: "₹ 2,450", class: "opacity-70" },
            { text: "₹ 3,890", class: "text-primary font-bold" },
            { text: "₹ 5,120", class: "text-primary font-bold scale-110 transition-transform duration-300" }
        ];

        let currentIndex = 0;

        setTimeout(() => {
            const seqTimer = setInterval(() => {
                currentIndex++;
                if (currentIndex < sequence.length) {
                    amountElement.textContent = sequence[currentIndex].text;
                    amountElement.className = sequence[currentIndex].class;

                    if (currentIndex === 1) {
                        step1.style.display = 'none';
                        step2.textContent = "₹ 1,200";
                    }
                    if (currentIndex === 2) {
                        step2.textContent = "₹ 2,450";
                    }
                    if (currentIndex === 3) {
                        step1.style.display = 'inline';
                        step1.textContent = "₹ 2,450";
                        step2.textContent = "₹ 3,890";
                        clearInterval(seqTimer);
                    }
                }
            }, 800);
        }, 1000);
    </script>
</body>

</html>
